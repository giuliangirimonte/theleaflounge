<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 - Page Not Found</title>
<style>
body {
background-color: rgb(51, 65, 41);
}
.errorContainer {
  display: grid;
  place-items: center;

}

.errorContainer header{
  margin-top: 15vh;
  font-size: clamp(3rem, 5vw, 1.2rem);
  text-align: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  font-weight: bolder;
  color: white;
  margin-bottom: -10vh;
}
.errorContainer h1 {
  font-size: clamp(5rem, 9vw, 3rem);
  text-align: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  font-weight: bolder;
  color: white;
  margin: 10rem auto;
  margin-bottom: -1vh;
}

.errorContainer h2{
  font-size: clamp(1rem, 5vw, 1.2rem);
  text-align: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  font-weight: bold;
  color: white;
}

.errorContainer p{
  font-size: clamp(1rem, 3vw, 1rem);
  text-align: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  font-weight: lighter;
  color: white;
}

.errorContainer a{
  width: 40vw;
  height: 2vh;
  border-top: 1px solid rgba(153, 203, 117, 0.205);
  border-bottom: 1px solid rgba(255, 255, 255, 0.146);
  border-right: 1px solid rgba(124, 161, 94, 0.124);
  border-left: 1px solid rgba(119, 128, 112, 0.29);
  border-radius: 35px;
  color: white;
  background-color: #6e806b62;
  padding: 0.8rem;
  font-size: 1rem;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  cursor: pointer;
  justify-content: center;
  text-align: center;
  text-decoration: none;
  transition: 0.3s;
  margin-left: 20px;
  margin-right: 5px;
  margin-bottom: 6vh;
}
</style>
</head>

<body>  
    <div class="errorContainer">
    <header>The Leaf Lounge</header>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you are looking for does not exist.</p>
    <a href="https://giuliangirimonte.github.io/theleaflounge/index.html">Go back to Home</a>
    </div>

</body>

</html>
